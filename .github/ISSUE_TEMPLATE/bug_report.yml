name: Bug report
description: Report something that isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in as much detail as you can so we can reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened vs. what you expected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behaviour?
      placeholder: |
        1. Add Auditable to model X
        2. Update the record from the panel
        3. See error ...
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Output of `composer show zhenjun/filament-audit-trail | grep versions`
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: filament-version
    attributes:
      label: Filament version
      placeholder: "5.x"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.2"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "11.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / stack trace
      description: Paste any errors. This will be formatted as code automatically.
      render: shell
